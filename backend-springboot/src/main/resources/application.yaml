spring:
  config:
    import: "optional:file:.env[.properties]"
  
  application:
    name: backend-springboot

  datasource:
    url: jdbc:postgresql://localhost:5432/trackfix_system
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379
      password: redis

jwt:
  secret: "${JWT_SECRET}"
  expiration-access: 900000
  expiration-refresh: 2592000000
  issuer: trackfix_system
